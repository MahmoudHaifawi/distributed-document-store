# One image, launched seven times by role. Build once:  docker compose up --build
# Open http://localhost:8078/login   (seeded admin: mahmoud / admin)
#
# Every service runs the same image (built once from the root Dockerfile) and differs only by its
# SPRING_PROFILES_ACTIVE role. Addressing is by compose service name: the coordinator is told the
# data-node list via CLUSTER_NODES, and the gateway finds the coordinator via BOOTSTRAP_URL. Node
# service names are capitalised (Node0..) so they match the CLUSTER_NODES / mesh names the
# consistent-hash ring is built from.
#
# Sharding (M6): the five data nodes form a consistent-hash ring (VNODES_PER_NODE virtual nodes each,
# default 150). Every schema is placed on REPLICATION_FACTOR of the five nodes, so with RF=3 each schema
# lives on 3 of 5. Each node builds the ring from its own live membership view (see "Dynamic membership"
# below), so CLUSTER_NODES and REPLICATION_FACTOR are set identically on the coordinator and on every
# node via the shared x-cluster-env block below.
#
# Tunable consistency (M7): WRITE_CONSISTENCY / READ_CONSISTENCY (ONE | QUORUM | ALL) set how many of a
# schema's replicas must acknowledge a schema/document write (W) and answer a read by id (R). With RF=3,
# QUORUM is 2 of 3, so W + R = 4 > 3 gives read-your-writes for document creates, updates and deletes
# (a delete writes a tombstone, M8), a write survives one replica being down, and a read repairs a
# replica that missed a write (reconciled by vector clock). Set identically on every node.
#
# Dynamic membership (M9): the data nodes find each other and detect failures themselves with SWIM
# (ping / indirect ping / suspect / dead) and spread membership changes by gossip. The ring is rebuilt on
# every node when the live set changes, so a stopped or restarted node needs NO coordinator restart.
#  - GOSSIP_ENABLED: "true" turns this on. Use the literal strings "true" / "false": "1" or "yes" read
#    as false. "false" restores the old one-shot mesh wiring by the coordinator.
#  - NODE_NAME: each node's STABLE identity, set per service below, spelled exactly as in CLUSTER_NODES.
#    The ring is keyed by node name; without it a node announces its container-id hostname, which changes
#    when the container is recreated, and every virtual node (and the data on disk) would move.
#  - SEED_NODES: the contacts a starting node tries, in order, until one admits it (the first that
#    answers wins; a node skips itself). Live data nodes first, the coordinator (a fixed SWIM seed) last.
#    Unset, it falls back to CLUSTER_NODES.
x-cluster-env: &cluster-env
  CLUSTER_NODES: "Node0:8080,Node1:8080,Node2:8080,Node3:8080,Node4:8080"
  REPLICATION_FACTOR: "3"
  WRITE_CONSISTENCY: "QUORUM"
  READ_CONSISTENCY: "QUORUM"
  GOSSIP_ENABLED: "true"
  SEED_NODES: "Node0:8080,Node1:8080,Node2:8080,Node3:8080,Node4:8080,bootstrappingnode:8079"
  # SWIM tuning, all optional (shown with their defaults; leave SWIM_GOSSIP_MAX >= 2):
  # SWIM_PERIOD_MS: "1000"
  # SWIM_PING_TIMEOUT_MS: "500"
  # SWIM_INDIRECT_K: "3"
  # SWIM_SUSPECT_TIMEOUT_MS: "5000"

services:
  Node0:
    image: nosql-db:latest
    build: .
    environment:
      <<: *cluster-env
      SPRING_PROFILES_ACTIVE: node
      NODE_NAME: "Node0"
    networks: [db_cluster]
  Node1:
    image: nosql-db:latest
    environment:
      <<: *cluster-env
      SPRING_PROFILES_ACTIVE: node
      NODE_NAME: "Node1"
    networks: [db_cluster]
  Node2:
    image: nosql-db:latest
    environment:
      <<: *cluster-env
      SPRING_PROFILES_ACTIVE: node
      NODE_NAME: "Node2"
    networks: [db_cluster]
  Node3:
    image: nosql-db:latest
    environment:
      <<: *cluster-env
      SPRING_PROFILES_ACTIVE: node
      NODE_NAME: "Node3"
    networks: [db_cluster]
  Node4:
    image: nosql-db:latest
    environment:
      <<: *cluster-env
      SPRING_PROFILES_ACTIVE: node
      NODE_NAME: "Node4"
    networks: [db_cluster]

  bootstrappingnode:
    image: nosql-db:latest
    environment:
      <<: *cluster-env
      SPRING_PROFILES_ACTIVE: coordinator
    depends_on: [Node0, Node1, Node2, Node3, Node4]
    networks: [db_cluster]

  dbms:
    image: nosql-db:latest
    environment:
      SPRING_PROFILES_ACTIVE: gateway
      BOOTSTRAP_URL: "http://bootstrappingnode:8079"
    ports:
      - "8078:8078"
    depends_on: [bootstrappingnode]
    networks: [db_cluster]

  # Observability (M12). Every role exposes /actuator/prometheus (public, no token); Prometheus scrapes all seven
  # processes by service name every 10s (monitoring/prometheus.yml) and Grafana ships a provisioned dashboard on
  # top of it.
  #  - Prometheus  http://localhost:9090
  #  - Grafana     http://localhost:3000   dashboard "NoSQL Cluster" opens with no login (anonymous Viewer);
  #                to edit, sign in as admin / admin (the DEMO default below; change GF_SECURITY_ADMIN_PASSWORD
  #                for anything shared).
  # Neither service is needed by the database: `docker compose up Node0 ... dbms` still starts without them.
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [Node0, Node1, Node2, Node3, Node4, bootstrappingnode, dbms]
    networks: [db_cluster]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/nosql-cluster.json"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [db_cluster]

networks:
  db_cluster:
    driver: bridge
