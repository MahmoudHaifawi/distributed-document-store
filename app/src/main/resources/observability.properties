# M12 observability, shared by every role (loaded via @PropertySource on ObservabilityConfig).
# Kept out of application.properties on purpose: the test classpath's application.properties shadows the main one,
# so a property that lives there would never be exercised by the app module's tests.

# Expose ONLY the scrape and probe endpoints; env, beans, heapdump, loggers, ... stay unexposed (404).
management.endpoints.web.exposure.include=health,prometheus

# Publish the http.server.requests latency histogram (the http_server_requests_seconds_bucket series). Without it
# Micrometer exports only _count/_sum/_max and the dashboard's p50/p95/p99 panels, which run histogram_quantile over
# the buckets, read "No data". Scoped to this one timer, so no other meter pays for buckets.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
