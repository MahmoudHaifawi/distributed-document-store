# Provisioned Grafana datasource: the compose `prometheus` service. The fixed uid is what the dashboard JSON
# (monitoring/grafana/dashboards/nosql-cluster.json) references, so it must not change without updating that file.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
